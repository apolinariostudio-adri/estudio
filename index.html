<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apolinário Studio | Entretenimentos & Produções</title>
    <meta name="description" content="Apolinário Studio — Produções audiovisuais, formatos disruptivos e narrativas originais para cinema e mídias digitais.">
    <meta property="og:title" content="Apolinário Studio | Entretenimentos & Produções">
    <meta property="og:description" content="Narrativas que manipulam a realidade através do cinema e das mídias digitais.">
    <style>
        :root {
            --vermelho: #e50914;
            --azul: #00e5ff;
            --roxo: #bb00ff;
            --fundo: #060608;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fundo); color: #fff;
            overflow-x: hidden;
        }

        /* ===== CURSOR CINEMATOGRÁFICO ===== */
        @media (hover: hover) and (pointer: fine) {
            body, a, button, .card-amostra, .barra-progresso, input { cursor: none !important; }
        }
        .cursor-dot, .cursor-ring {
            position: fixed; top: 0; left: 0; pointer-events: none; z-index: 10001;
            border-radius: 50%; transform: translate(-50%, -50%);
        }
        .cursor-dot { width: 6px; height: 6px; background: var(--vermelho); box-shadow: 0 0 10px var(--vermelho); }
        .cursor-ring {
            width: 34px; height: 34px; border: 1.5px solid rgba(229,9,20,0.6);
            transition: width 0.25s, height 0.25s, border-color 0.25s, background 0.25s;
        }
        .cursor-ring.grande {
            width: 60px; height: 60px; border-color: var(--vermelho);
            background: rgba(229,9,20,0.12); box-shadow: 0 0 25px rgba(229,9,20,0.4);
        }
        @media (hover: none) { .cursor-dot, .cursor-ring { display: none; } }

        /* ===== PRELOADER DE ESTÚDIO ===== */
        #preloader {
            position: fixed; inset: 0; z-index: 99999; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 25px; transition: opacity 0.9s ease, visibility 0.9s;
        }
        #preloader.oculto { opacity: 0; visibility: hidden; }
        .pre-nome {
            font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 900; letter-spacing: 12px;
            text-transform: uppercase; color: #fff; text-align: center;
            animation: preBrilho 2s ease-in-out infinite;
        }
        .pre-nome b { color: var(--vermelho); }
        @keyframes preBrilho { 0%,100% { text-shadow: 0 0 20px rgba(229,9,20,0.3); } 50% { text-shadow: 0 0 45px rgba(229,9,20,0.9); } }
        .pre-apresenta { font-size: 10px; letter-spacing: 6px; color: #666; text-transform: uppercase; font-family: monospace; }
        .pre-barra { width: 180px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .pre-barra-fill { height: 100%; width: 0%; background: var(--vermelho); box-shadow: 0 0 10px var(--vermelho); transition: width 0.3s; }
        .pre-contador { font-family: monospace; font-size: 12px; color: var(--vermelho); letter-spacing: 3px; }

        /* ===== BARRA DE PROGRESSO DE SCROLL ===== */
        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px; width: 0%;
            background: linear-gradient(to right, var(--vermelho), #ff5a3c);
            box-shadow: 0 0 12px var(--vermelho); z-index: 9999; transition: width 0.1s;
        }

        /* ===== FILM GRAIN ===== */
        body::after {
            content: ""; position: fixed; inset: -100%; z-index: 998;
            pointer-events: none; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            animation: grain 0.6s steps(4) infinite;
        }
        @keyframes grain {
            0% { transform: translate(0,0); }     25% { transform: translate(-2%,3%); }
            50% { transform: translate(3%,-2%); } 75% { transform: translate(-3%,-3%); }
            100% { transform: translate(2%,2%); }
        }

        /* ===== GLITCH TOTAL (EASTER EGG) ===== */
        body.glitch-total { animation: glitchBody 0.35s steps(2) 6; }
        @keyframes glitchBody {
            0%   { filter: none; transform: translate(0,0); }
            25%  { filter: hue-rotate(90deg) contrast(1.6); transform: translate(-4px, 2px); }
            50%  { filter: invert(0.12) saturate(3); transform: translate(4px, -2px); }
            75%  { filter: hue-rotate(-60deg); transform: translate(-2px, -3px); }
            100% { filter: none; transform: translate(0,0); }
        }
        .glitch-flash {
            position: fixed; inset: 0; z-index: 99998; pointer-events: none;
            background: rgba(229,9,20,0.15); display: none;
            font-family: monospace; color: var(--vermelho);
            justify-content: center; align-items: center;
            font-size: clamp(1rem, 4vw, 2rem); letter-spacing: 8px; text-transform: uppercase;
        }
        .glitch-flash.ativo { display: flex; animation: glitchTexto 0.4s infinite; }

        /* ===== NAVBAR ===== */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 7%;
            background: linear-gradient(to bottom, rgba(6,6,8,0.8), transparent);
            position: fixed; width: 100%; top: 0; z-index: 100;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .logo-container img { height: 45px; max-width: 180px; object-fit: contain; }
        .logo-fallback { font-size: 20px; font-weight: 900; color: var(--vermelho); text-transform: uppercase; letter-spacing: 2px; }
        .nav-links { display: flex; align-items: center; gap: 25px; }
        .nav-links a {
            color: #fff; text-decoration: none; font-size: 14px; font-weight: 500;
            transition: 0.3s; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); padding: 6px 2px;
        }
        .nav-links a:hover { color: var(--vermelho); }

        .menu-toggle {
            display: none; background: none; border: none; cursor: pointer;
            width: 32px; height: 24px; position: relative; z-index: 102;
        }
        .menu-toggle span { display: block; width: 100%; height: 2px; background: #fff; position: absolute; left: 0; transition: 0.3s; }
        .menu-toggle span:nth-child(1) { top: 0; }
        .menu-toggle span:nth-child(2) { top: 11px; }
        .menu-toggle span:nth-child(3) { top: 22px; }
        .menu-toggle.ativo span:nth-child(1) { top: 11px; transform: rotate(45deg); }
        .menu-toggle.ativo span:nth-child(2) { opacity: 0; }
        .menu-toggle.ativo span:nth-child(3) { top: 11px; transform: rotate(-45deg); }

        /* ===== HERO ===== */
        .hero {
            position: relative; height: 100vh; min-height: 560px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: flex-start; overflow: hidden; width: 100%;
            background: radial-gradient(ellipse at 70% 30%, #1a0a10 0%, var(--fundo) 70%);
        }
        .video-background {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover; z-index: 0;
            transition: opacity 0.8s ease;
        }
        .overlay {
            position: absolute; inset: 0; z-index: 1; pointer-events: none;
            background:
                linear-gradient(to top, var(--fundo) 5%, rgba(6,6,8,0.1) 50%, rgba(6,6,8,0.7) 95%),
                linear-gradient(to right, rgba(6,6,8,0.9) 15%, transparent);
        }
        .revelacao-lenta {
            padding-left: 7%; padding-right: 7%; position: relative; z-index: 2;
            opacity: 0; transform: translateY(30px);
            animation: revelar 1.2s 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: transform;
        }
        @keyframes revelar { to { opacity: 1; transform: translateY(0); } }

        .titulo-efeito {
            font-size: clamp(2rem, 5.5vw, 3.8rem);
            max-width: 800px; line-height: 1.1; margin-bottom: 20px;
            text-transform: uppercase; font-weight: 900; letter-spacing: -1px;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.9);
        }
        .texto-digitado { color: var(--vermelho); text-shadow: 0 0 15px rgba(229, 9, 20, 0.8); }
        .cursor-matrix { font-weight: 100; color: var(--vermelho); animation: piscar-cursor 0.7s infinite; }
        @keyframes piscar-cursor { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        .hero-desc {
            font-size: clamp(1rem, 2vw, 1.2rem); color: #ccc;
            max-width: 600px; margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }
        .hero-cta {
            display: inline-block; padding: 14px 36px;
            background: var(--vermelho); color: #fff; text-decoration: none;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px;
            border-radius: 6px; transition: 0.3s;
            box-shadow: 0 4px 20px rgba(229,9,20,0.4);
        }
        .hero-cta:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(229,9,20,0.6); }

        .capitulos-hero { position: absolute; bottom: 40px; left: 7%; z-index: 5; display: flex; gap: 12px; }
        .cap-hero {
            width: 60px; height: 3px; background: rgba(255,255,255,0.25);
            border: none; cursor: pointer; border-radius: 3px; overflow: hidden;
            position: relative; transition: 0.3s; padding: 0;
        }
        .cap-hero::after { content: ""; position: absolute; inset: 0; width: 0%; background: var(--vermelho); box-shadow: 0 0 8px var(--vermelho); }
        .cap-hero.ativo::after { animation: preencherCap 10s linear forwards; }
        .cap-hero:hover { background: rgba(255,255,255,0.5); }
        @keyframes preencherCap { to { width: 100%; } }

        /* ===== MARQUEE DAS EMOÇÕES ===== */
        .marquee-emocoes {
            overflow: hidden; white-space: nowrap; padding: 22px 0;
            border-top: 1px solid rgba(229,9,20,0.25); border-bottom: 1px solid rgba(229,9,20,0.25);
            background: rgba(229,9,20,0.04); position: relative; z-index: 10;
        }
        .marquee-track { display: inline-block; animation: marquee 22s linear infinite; }
        .marquee-track span {
            font-size: clamp(1rem, 2.5vw, 1.5rem); font-weight: 900; text-transform: uppercase;
            letter-spacing: 6px; color: rgba(255,255,255,0.85); margin: 0 30px;
        }
        .marquee-track span i { color: var(--vermelho); font-style: normal; margin: 0 8px; text-shadow: 0 0 15px var(--vermelho); }
        @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* ===== SEÇÕES ===== */
        .container { padding: 80px 7%; position: relative; z-index: 10; }
        h2 {
            font-size: clamp(1.6rem, 3.5vw, 2.3rem); margin-bottom: 15px;
            text-transform: uppercase; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitulo-unico {
            color: #aaa; font-size: 1.1rem; max-width: 600px; line-height: 1.6;
            border-left: 3px solid var(--vermelho); padding-left: 20px; margin-bottom: 50px;
        }

        /* ===== MANIFESTO (HIERARQUIA EXAGERADA — TENDÊNCIA 2026) ===== */
        .manifesto {
            padding: 130px 7%; position: relative; z-index: 10; text-align: center;
            background: radial-gradient(ellipse at 50% 120%, rgba(229,9,20,0.12), transparent 60%);
        }
        .manifesto-selo {
            display: inline-block; font-family: monospace; font-size: 10px; letter-spacing: 5px;
            color: var(--vermelho); border: 1px solid rgba(229,9,20,0.4); padding: 8px 20px;
            border-radius: 100px; margin-bottom: 45px; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(229,9,20,0.2); animation: preBrilho 3s infinite;
        }
        .manifesto-titulo {
            font-size: clamp(2.2rem, 8vw, 7rem); font-weight: 900; line-height: 1.02;
            text-transform: uppercase; letter-spacing: -3px; max-width: 1200px; margin: 0 auto 35px;
            text-shadow: 0 10px 60px rgba(0,0,0,0.9);
        }
        .manifesto-titulo .destaque {
            color: transparent; -webkit-text-stroke: 2px var(--vermelho);
            display: inline-block; transition: 0.4s;
        }
        .manifesto-titulo .destaque:hover { color: var(--vermelho); text-shadow: 0 0 60px rgba(229,9,20,0.9); }
        .manifesto-sub {
            font-size: clamp(0.95rem, 1.8vw, 1.15rem); color: #999; max-width: 620px;
            margin: 0 auto; line-height: 1.8; letter-spacing: 0.5px;
        }
        .manifesto-assinatura {
            margin-top: 55px; font-family: monospace; font-size: 11px;
            letter-spacing: 6px; color: #555; text-transform: uppercase;
        }
        .manifesto-assinatura b { color: var(--vermelho); }

        .mural-disruptivo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
        .bloco-supremo.grande { grid-row: span 2; min-height: 520px; height: 100%; }
        .bloco-supremo {
            position: relative; border-radius: 24px; overflow: hidden; height: 240px;
            background: rgba(14, 14, 20, 0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.5s cubic-bezier(0.25,1,0.5,1), box-shadow 0.5s, border-color 0.5s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .bloco-supremo:hover { transform: scale(1.03) translateY(-8px); border-color: rgba(229,9,20,0.4); box-shadow: 0 25px 50px rgba(229,9,20,0.2); }
        .bloco-supremo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(35%) brightness(0.5); transition: transform 0.8s ease, filter 0.5s ease; }
        .bloco-supremo:hover img { transform: scale(1.06); filter: grayscale(0%) brightness(0.6); }

        .filtro-neon { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at 10% 20%, rgba(229,9,20,0.25) 0%, transparent 60%); }
        .filtro-neon.azul { background: radial-gradient(circle at 10% 20%, rgba(0,229,255,0.25) 0%, transparent 60%); }
        .filtro-neon.roxo { background: radial-gradient(circle at 10% 20%, rgba(187,0,255,0.25) 0%, transparent 60%); }

        .tag-exclusiva {
            position: absolute; top: 25px; left: 25px; z-index: 2;
            background: rgba(229,9,20,0.2); border: 1px solid rgba(229,9,20,0.4);
            backdrop-filter: blur(10px); color: #fff; padding: 6px 16px; font-size: 10px;
            font-weight: 700; text-transform: uppercase; border-radius: 100px; letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(229,9,20,0.3);
        }
        .tag-exclusiva.azul { background: rgba(0,229,255,0.2); border-color: rgba(0,229,255,0.4); box-shadow: 0 0 15px rgba(0,229,255,0.3); }
        .tag-exclusiva.roxo { background: rgba(187,0,255,0.2); border-color: rgba(187,0,255,0.4); box-shadow: 0 0 15px rgba(187,0,255,0.3); }

        .conteudo-supremo { position: absolute; bottom: 0; left: 0; width: 100%; padding: 35px; z-index: 2; background: linear-gradient(to top, rgba(6,6,8,0.95) 40%, transparent); }
        .conteudo-supremo span { font-size: 11px; color: var(--vermelho); font-weight: 800; letter-spacing: 2px; display: block; margin-bottom: 8px; }
        .conteudo-supremo span.azul { color: var(--azul); }
        .conteudo-supremo span.roxo { color: var(--roxo); }
        .conteudo-supremo h3 { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
        .conteudo-supremo p { font-size: 13.5px; color: #bbb; line-height: 1.6; }

        /* ===== VITRINE DE AMOSTRAS ===== */
        .vitrine-amostas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card-amostra {
            position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
            background: #0a0a0f; transition: 0.4s cubic-bezier(0.25,1,0.5,1);
        }
        .card-amostra video { width: 100%; height: 100%; object-fit: cover; opacity: 0.55; transition: 0.5s; }
        .card-amostra:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(229,9,20,0.5); box-shadow: 0 20px 45px rgba(229,9,20,0.25); }
        .card-amostra:hover video { opacity: 0.9; transform: scale(1.05); }
        .card-amostra .play-overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 10px; z-index: 2;
            background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(6,6,8,0.75));
        }
        .card-amostra .icone-play {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(229,9,20,0.85); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(229,9,20,0.6); transition: 0.3s; font-size: 20px; padding-left: 4px;
        }
        .card-amostra:hover .icone-play { transform: scale(1.15); box-shadow: 0 0 40px rgba(229,9,20,0.9); }
        .card-amostra .titulo-amostra { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 6px #000; text-align: center; padding: 0 10px; }
        .duracao-badge {
            position: absolute; top: 12px; right: 12px; z-index: 3;
            background: rgba(0,0,0,0.7); border: 1px solid rgba(229,9,20,0.4);
            padding: 3px 10px; border-radius: 100px; font-size: 10px;
            font-family: monospace; letter-spacing: 1px; color: var(--vermelho);
        }

        /* ===== MODAL PLAYER ===== */
        .modal-cinema { position: fixed; inset: 0; z-index: 2000; display: none; background: rgba(0,0,0,0.97); justify-content: center; align-items: center; }
        .modal-cinema.aberto { display: flex; animation: fadeInModal 0.4s ease; }
        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

        .palco-cinema { position: relative; width: 90vw; max-width: 1100px; aspect-ratio: 2.35/1; background: #000; }
        .palco-inner {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            box-shadow: 0 0 120px rgba(229,9,20,0.15), 0 40px 80px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .palco-cinema video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }

        /* Equalizer vivo no player */
        .viz-player {
            position: absolute; bottom: 62px; left: 20px; z-index: 7;
            display: flex; align-items: flex-end; gap: 3px; height: 22px; opacity: 0; transition: 0.4s;
        }
        .palco-cinema.som-on .viz-player { opacity: 1; }
        .viz-player i {
            width: 3px; background: var(--vermelho); border-radius: 2px; height: 20%;
            box-shadow: 0 0 6px var(--vermelho);
            animation: vizDanca 0.7s ease-in-out infinite alternate;
        }
        .viz-player i:nth-child(1) { animation-duration: 0.5s; }
        .viz-player i:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.1s; }
        .viz-player i:nth-child(3) { animation-duration: 0.6s; animation-delay: 0.2s; }
        .viz-player i:nth-child(4) { animation-duration: 0.9s; animation-delay: 0.05s; }
        .viz-player i:nth-child(5) { animation-duration: 0.55s; animation-delay: 0.15s; }
        .viz-player i:nth-child(6) { animation-duration: 0.75s; animation-delay: 0.25s; }
        @keyframes vizDanca { from { height: 15%; } to { height: 100%; } }

        .countdown-cinema { position: absolute; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: center; background: #050507; }
        .countdown-cinema .numero {
            font-size: 8rem; font-weight: 900; color: var(--vermelho);
            text-shadow: 0 0 40px rgba(229,9,20,0.8); font-family: monospace;
            animation: pulsarNum 1s ease infinite;
        }
        @keyframes pulsarNum { 0% { transform: scale(1.3); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { opacity: 0.6; } }
        .countdown-cinema .circulo-guia {
            position: absolute; width: 260px; height: 260px; border-radius: 50%;
            border: 2px solid rgba(229,9,20,0.3); border-top-color: var(--vermelho);
            animation: girarClaquete 1s linear infinite;
        }
        @keyframes girarClaquete { to { transform: rotate(360deg); } }
        .countdown-cinema.oculto { display: none; }

        .controles-cinema {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 8;
            padding: 40px 20px 14px;
            background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
            opacity: 0; transition: opacity 0.35s; display: flex; flex-direction: column; gap: 10px;
        }
        .palco-cinema:hover .controles-cinema,
        .palco-cinema.pausado .controles-cinema { opacity: 1; }

        .barra-progresso { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; cursor: pointer; position: relative; transition: height 0.2s; }
        .barra-progresso:hover { height: 7px; }
        .barra-preenchida { height: 100%; width: 0%; background: var(--vermelho); border-radius: 4px; position: relative; box-shadow: 0 0 10px var(--vermelho); }
        .barra-preenchida::after {
            content: ""; position: absolute; right: -6px; top: 50%; transform: translateY(-50%) scale(0);
            width: 13px; height: 13px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 12px var(--vermelho); transition: transform 0.2s;
        }
        .barra-progresso:hover .barra-preenchida::after { transform: translateY(-50%) scale(1); }

        .linha-controles { display: flex; align-items: center; gap: 16px; }
        .btn-ctrl {
            background: none; border: none; color: #fff; cursor: pointer;
            font-size: 18px; width: 38px; height: 38px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; transition: 0.25s;
        }
        .btn-ctrl:hover { background: rgba(229,9,20,0.25); color: var(--vermelho); transform: scale(1.1); }

        .grupo-volume { display: flex; align-items: center; gap: 8px; }
        .slider-volume {
            -webkit-appearance: none; appearance: none; width: 0; height: 4px;

        .btn-som-global {

        .btn-som-global:not(.som-ativo) .ondas i { animation-play-state: paused; height: 15%; opacity: 0.4; }

        .coordenada-secreta {
            position: fixed; bottom: 15px; right: 20px;

        }

        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25,1,0.5,1); }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {

            }
            .nav-links.aberto { right: 0; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }

        }
